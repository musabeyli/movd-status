<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Movd — Back shortly</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#111827; --muted:#4b5563; --brand:#111827; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; text-align:center; }
  .logo { font-weight:800; font-size:22px; letter-spacing:-0.5px; margin-bottom:18px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 20px; }
  .btn { display:block; width:100%; padding:14px 16px; border-radius:12px; font-weight:700; text-decoration:none; margin-top:10px; font-size:16px; }
  .primary { background:var(--brand); color:#fff; }
  .secondary { background:#fff; color:var(--brand); border:1.5px solid var(--brand); }
  .safe { margin-top:20px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">movd</div>
    <h1>We're doing quick maintenance</h1>
    <p>This page is temporarily unavailable. Your move and booking details are safe, and our team is here to help in the meantime.</p>
    <a class="btn primary" href="tel:+19176829649">Call or text (917) 682-9649</a>
    <a class="btn secondary" href="mailto:contact@movd.nyc">Email contact@movd.nyc</a>
    <div class="safe">Please check back soon. Thank you for your patience.</div>
  </main>
</body>
</html>
